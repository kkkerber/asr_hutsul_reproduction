defaults:
  sample_rate: 16000

  # Generation / decoding -----------------------------------------------
  language: uk
  task: transcribe
  generation_max_length: 225
  num_beams: 1

  # Training schedule ---------------------------------------------------
  optimizer: adamw_torch
  learning_rate: 1.0e-4
  warmup_steps: 500
  lr_scheduler_type: linear
  weight_decay: 0.0
  max_grad_norm: 1.0

  # Logging / eval / checkpoint cadence --------------------------------
  eval_steps: 500
  save_steps: 500
  logging_steps: 50
  save_total_limit: 3

  # Mixed precision / memory -------------------------------------------
  fp16: true
  bf16: false
  gradient_checkpointing: true
  predict_with_generate: true

  # Best-checkpoint selection ------------------------------------------
  metric_for_best_model: cer
  greater_is_better: false
  load_best_model_at_end: true
  early_stopping_patience: 5
  early_stopping_threshold: 0.0

  # PEFT / LoRA ---------------------------------------------------------
  use_lora: true
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    target_modules: [q_proj, v_proj]

  # Misc ---------------------------------------------------------------
  remove_unused_columns: false
  group_by_length: false
  dataloader_num_workers: 2
  report_to: [tensorboard]
  seed: 42

# ---------------------------------------------------------------------
# Variants
variants:

  whisper-small:
    model_name_or_path: openai/whisper-small
    max_steps: 8000
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4

  whisper-medium:
    model_name_or_path: openai/whisper-medium
    max_steps: 8000
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4

  whisper-large-v3:
    model_name_or_path: openai/whisper-large-v3
    max_steps: 8000
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 4

  whisper-large-uk-2:
    model_name_or_path: arampacha/whisper-large-uk-2
    max_steps: 4000
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 4

  # ------------------------------------------------------------------
  # Whisper-large-v3 with paper-matching schedule + augmentation.
  # ------------------------------------------------------------------
  # The baseline ``whisper-large-v3`` matched the paper protocol
  # exactly (8000 steps, eff. batch 16, LoRA r=16 q/v, linear LR with
  # warmup 500, metric=CER, patience=5) but reproduced 1.09 pp above
  # paper CER (4.99 vs 3.90) and 1.48 pp above paper WER (14.68 vs
  # 13.20).  The training-curve analysis showed healthy convergence
  # (eval CER plateaus in 3.9–4.1 % from step 3500 onwards) — i.e. not
  # a scheduling bug.  The remaining gap is most plausibly explained
  # by augmentation, which most ASR papers describe generally and
  # apply across all models.
  #
  # This variant changes ONLY one thing vs the baseline:
  #     use_augmentation: false  →  true
  # Single-variable isolation experiment; all other parameters match
  # the baseline exactly.  Waveform-only augmentation (the Whisper
  # trainer disables SpecAugment for use_augmentation=true): Gaussian
  # noise, ±2 semitone pitch shift, 0.8–1.2× time stretch, ±6 dB gain.
  # Applied to the train split only.
  #
  # Expected test result: CER 4.3–4.7 %, WER 13.5–14.0 %
  # (a 0.3–0.7 pp CER / 0.7–1.2 pp WER improvement vs baseline).
  whisper-large-v3-aug:
    model_name_or_path: openai/whisper-large-v3
    max_steps: 8000
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 4
    use_augmentation: true
