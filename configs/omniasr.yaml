# =====================================================================
# OmniASR (CTC) fine-tuning configuration
# ---------------------------------------------------------------------
# Consumed by ``models/omniasr_trainer.py``.
#
#   python train.py --model_type omniasr --variant omniasr-300m
#   python train.py --model_type omniasr --variant omniasr-1b
#
# OmniASR ships a tri-stage learning-rate schedule: a linear warmup
# fraction, a flat-hold fraction, and a linear decay over the
# remainder of training.  The fractions below match the paper.
# =====================================================================

defaults:
  sample_rate: 16000

  # Schedule (paper) ----------------------------------------------------
  learning_rate: 5.0e-5
  warmup_ratio: 0.10
  hold_ratio: 0.40
  # decay_ratio is implicitly 1 - warmup_ratio - hold_ratio
  weight_decay: 0.0
  max_grad_norm: 1.0
  optimizer: adamw_torch

  # Cadence -------------------------------------------------------------
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 100
  save_total_limit: 3

  # Mixed precision / memory -------------------------------------------
  fp16: true
  bf16: false
  gradient_checkpointing: true

  # Best-checkpoint selection ------------------------------------------
  metric_for_best_model: cer
  greater_is_better: false
  load_best_model_at_end: true
  early_stopping_patience: 5
  early_stopping_threshold: 0.0

  # CTC-specific --------------------------------------------------------
  ctc_loss_reduction: mean
  ctc_zero_infinity: true

  # Audio-length safety (CTC) -----------------------------------------
  min_train_audio_duration_sec: 1.0
  min_collator_input_samples: 0

  # Misc ---------------------------------------------------------------
  remove_unused_columns: false
  group_by_length: true
  length_column_name: input_length
  dataloader_num_workers: 2
  report_to: [tensorboard]
  seed: 42
  trust_remote_code: true     # OmniASR ships custom modeling code

variants:

  omniasr-300m:
    model_name_or_path: nvidia/omniasr-300m
    max_steps: 48000
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4   # effective batch 32

  omniasr-1b:
    model_name_or_path: nvidia/omniasr-1b
    max_steps: 36000
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 8   # effective batch 32
