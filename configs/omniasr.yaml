defaults:
  sample_rate: 16000

  # Schedule ----------------------------------------------------
  learning_rate: 5.0e-5
  warmup_ratio: 0.10
  hold_ratio: 0.40
  weight_decay: 0.0
  max_grad_norm: 1.0
  optimizer: adamw_torch

  # Cadence -------------------------------------------------------------
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 100
  save_total_limit: 3

  # Mixed precision / memory -------------------------------------------
  fp16: true
  bf16: false
  gradient_checkpointing: true

  # Best-checkpoint selection ------------------------------------------
  metric_for_best_model: cer
  greater_is_better: false
  load_best_model_at_end: true
  early_stopping_patience: 5
  early_stopping_threshold: 0.0

  # CTC-specific --------------------------------------------------------
  ctc_loss_reduction: mean
  ctc_zero_infinity: true

  # Audio-length safety (CTC) -----------------------------------------
  min_train_audio_duration_sec: 1.0
  min_collator_input_samples: 0

  # Misc ---------------------------------------------------------------
  remove_unused_columns: false
  group_by_length: true
  length_column_name: input_length
  dataloader_num_workers: 2
  report_to: [tensorboard]
  seed: 42
  trust_remote_code: true

# model_name_or_path notes:
#   ``nvidia/omniasr-{300m,1b}`` are not published on the HF Hub.
#   NVIDIA's actual CTC ASR family (Parakeet / Canary) ships as
#   ``.nemo`` files and requires the NeMo toolkit — it cannot be
#   loaded by ``AutoModelForCTC``.  The variants below default to the
#   nearest transformers-compatible Ukrainian CTC checkpoints; the
#   tri-stage scheduler (the trainer's distinctive piece) is
#   unchanged.  Override ``--model_name <id>`` to swap in a real
#   Parakeet/Canary checkpoint when running through NeMo.
variants:

  omniasr-300m:
    model_name_or_path: Yehor/wav2vec2-xls-r-300m-uk-with-lm
    max_steps: 48000
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4

  omniasr-1b:
    model_name_or_path: Yehor/w2v-bert-uk-v2.1
    max_steps: 36000
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 8
