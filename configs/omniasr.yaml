# Real Meta OmniASR (fairseq2) fine-tuning configuration.
#
# Consumed by ``models/omniasr_trainer.py``, which:
#   1. converts the HF dataset to fairseq2 manifest format,
#   2. renders ``configs/omniasr/ctc-finetune.yaml`` with dataset
#      paths injected,
#   3. launches ``python -m workflows.recipes.wav2vec2.asr``.
#
# fairseq2 + the official omnilingual-asr repo must be installed in
# the runtime; they are NOT pinned in requirements.txt (Parakeet-style
# isolation).  See README "OmniASR / fairseq2" section.
#
# Asset names (resolved by fairseq2's asset card at
# omnilingual-asr/src/omnilingual_asr/cards/models/rc_models_v1.yaml):
#   model.name     -> omniASR_CTC_300M
#       checkpoint URL: https://dl.fbaipublicfiles.com/mms/omniASR-CTC-300M.pt
#   tokenizer.name -> omniASR_tokenizer_v1
#       tokenizer URL : https://dl.fbaipublicfiles.com/mms/omniASR_tokenizer.model

defaults:
  seed: 42
  sample_rate: 16000

  # Paths to the cloned omnilingual-asr repo + Meta-schema YAML
  # template.  ``meta_yaml_template: null`` makes the trainer use
  # ``configs/omniasr/ctc-finetune.yaml`` (the project-bundled
  # template).  Override here only when running against a forked
  # Meta repo with a different recipe file.
  meta_repo_path: /content/omnilingual-asr
  meta_yaml_template: null

  # Paper-scale recipe settings (mirror what fairseq2 receives).
  max_num_steps: 48000
  grad_accumulation_num_batches: 4
  batch_size: 8
  learning_rate: 5.0e-5
  warmup_ratio: 0.10
  hold_ratio: 0.40
  precision: float16
  checkpoint_every_n_steps: 1000
  validate_every_n_steps: 1000

  # CTC sample-length safety (consistent with the other CTC trainers).
  min_train_audio_duration_sec: 1.0

  # Smoke-test defaults.  Activated per-variant.
  smoke: false
  smoke_train_size: 10
  smoke_dev_size: 5
  smoke_steps: 50

# Variants:
#   omniasr-ctc-300m        – paper-scale run (48k steps, batch 8 x grad-accum 4).
#   omniasr-ctc-300m-smoke  – 50-step sanity check on a 10/5-sample subset.
#
# The 1B / 3B / 7B OmniASR variants are NOT enabled here because their
# public HF checkpoint URLs are not present in the verified asset card.
# Add them only after confirming the registry exposes them.
variants:

  omniasr-ctc-300m:
    model_name_or_path: omniASR_CTC_300M

  omniasr-ctc-300m-smoke:
    model_name_or_path: omniASR_CTC_300M
    smoke: true
    smoke_train_size: 10
    smoke_dev_size: 5
    smoke_steps: 50
