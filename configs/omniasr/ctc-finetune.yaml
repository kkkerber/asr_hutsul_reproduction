# Meta-schema YAML template for the official fairseq2 OmniASR recipe.
#
# Consumed verbatim by
#   python -m workflows.recipes.wav2vec2.asr <out_dir> --config-file <this>
# after ``models/omniasr_trainer.py`` overrides ``dataset.name`` to
# point at the per-variant fairseq2 asset card it writes to
# ``~/.config/fairseq2/assets/<name>.yaml`` (the asset card maps the
# name to the actual manifest directory).
#
# Schema verified against:
#   workflows/recipes/wav2vec2/asr/default_config.py
#       Wav2Vec2AsrRecipeConfig / Wav2Vec2AsrDatasetSection
#       Wav2Vec2AsrTrainerSection
#   workflows/recipes/wav2vec2/asr/configs/ctc-finetune.yaml
#   src/omnilingual_asr/datasets/storage/manifest_storage.py
#       ManifestStorageConfig {read_text, cached_fd_count}
#   src/omnilingual_asr/datasets/tasks/asr_task.py
#       AsrTaskConfig
#   src/omnilingual_asr/datasets/impl/manifest_asr_dataset.py
#       MANIFEST_ASR_DATASET = "manifest_asr_dataset"
#       ManifestAsrDatasetConfig {data: Path}
#
# Audio-length fields are in SAMPLES (int), not seconds.  At 16 kHz:
#   1.0 s  =      16_000 samples
#   30.0 s =     480_000 samples
#   60.0 s =     960_000 samples

model:
  name: "omniASR_CTC_300M"

tokenizer:
  name: "omniASR_tokenizer_v1"

dataset:
  # ``name`` is the asset-card key; ``models/omniasr_trainer.py``
  # rewrites this at render time to a per-variant string and writes
  # the matching asset card under ``~/.config/fairseq2/assets/``.
  name: "__PLACEHOLDER_ASSET_NAME__"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MANIFEST"
  task_mode: "ASR"
  manifest_storage_config:
    read_text: true
    cached_fd_count: 1000
  asr_task_config:
    min_audio_len: 16_000        # 1.0 s @ 16 kHz
    max_audio_len: 480_000       # 30.0 s @ 16 kHz
    max_num_elements: 480000
    batch_size: 8
    batching_strategy: "LENGTH"
    num_seqs_multiple_of: 1
    normalize_audio: true
    batch_shuffle_window: 1000
    # fairseq2's AsrTask asserts ``example_shuffle_window > 0`` (the
    # zero case triggers a full-dataset shuffle that can OOM).  1000
    # gives meaningful windowed shuffling without unbounded memory
    # growth — well within budget for the Hutsul corpus (~6.7k train
    # samples after filtering).
    example_shuffle_window: 1000
    num_prefetch: 4
    # SpecAugment (off by default; set spec_aug_p to enable).
    spec_aug_p: null
    spec_aug_freq_mask_param: 80
    spec_aug_time_mask_param: 80

optimizer:
  config:
    lr: 5.0e-05
    betas: [0.9, 0.98]
    eps: 1.0e-08
    weight_decay: 0.0

lr_scheduler:
  config:
    stage_ratio: [0.1, 0.4, 0.5]
    start_lr_scale: 0.01
    final_lr_scale: 0.05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    dtype: "torch.float16"
  grad_accumulation:
    num_batches: 4

regime:
  num_steps: 48_000
  score_metric: "wer"
  validate_after_n_steps: 0
  validate_every_n_steps: 1000
  checkpoint_every_n_steps: 1000
  publish_metrics_every_n_steps: 200
