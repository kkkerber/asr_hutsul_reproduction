# Parakeet (NVIDIA NeMo) fine-tuning configuration.
#
# Backed by `models/parakeet_trainer.py`.  Requires the NeMo toolkit
# (`pip install 'nemo_toolkit[asr]'`).  See README for setup notes.
#
#   python train.py --model_type parakeet --variant parakeet-ctc-0.6b

defaults:
  sample_rate: 16000

  learning_rate: 1.0e-4
  max_steps: 20000
  warmup_steps: 1000
  weight_decay: 1.0e-3
  optimizer: adamw

  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1

  eval_every_n_steps: 500
  save_every_n_steps: 500
  logging_steps: 50
  save_top_k: 3

  precision: 16-mixed         # 16-mixed | bf16-mixed | 32-true
  gradient_clip_val: 1.0
  num_workers: 2

  use_augmentation: false
  seed: 42

  # Audio-length safety (consistent with the other CTC trainers).
  min_train_audio_duration_sec: 1.0

  # Vocabulary swap for Parakeet's BPE backbone.
  #   'bpe'  -> train a small SentencePiece BPE (vocab_size=128) on
  #            the Ukrainian training transcripts and apply it via
  #            EncDecCTCModelBPE.change_vocabulary(new_tokenizer_dir=...).
  #            This is the canonical low-resource path.
  #   'char' -> alias for a tiny (~64) BPE that behaves char-like.
  #   'keep' -> leave Parakeet's English BPE untouched.  Pipeline
  #            runs but Cyrillic input tokenises to mostly UNK —
  #            only useful as a sanity-check path.
  tokenizer_type: bpe

variants:

  parakeet-ctc-0.6b:
    model_name_or_path: nvidia/parakeet-ctc-0.6b

  parakeet-ctc-1.1b:
    model_name_or_path: nvidia/parakeet-ctc-1.1b
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 2
